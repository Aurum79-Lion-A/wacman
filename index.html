<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAC-MAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hud">
  <div><span class="k">SCORE</span><span id="score">0</span></div>
  <div><span class="k">HIGH SCORE</span><span id="hi">0</span></div>
  <div><span class="k">LEVEL</span><span id="lvl">1</span></div>
  <div><span class="k">LIVES</span><span id="lives" class="lives"></span></div>
</div>

<canvas id="c" width="456" height="504" aria-label="WACMAN game board"></canvas>

<div class="ctl">
  <div class="seg" role="group" aria-label="Difficulty">
    <button data-diff="easy" aria-pressed="false">EASY</button>
    <button data-diff="normal" aria-pressed="true">NORMAL</button>
    <button data-diff="hard" aria-pressed="false">HARD</button>
  </div>
  <button id="snd" aria-pressed="true">SOUND: ON</button>
</div>

<div class="pad" aria-label="Direction buttons">
  <button class="up" data-d="up" aria-label="Up">▲</button>
  <button class="left" data-d="left" aria-label="Left">◀</button>
  <button class="down" data-d="down" aria-label="Down">▼</button>
  <button class="right" data-d="right" aria-label="Right">▶</button>
</div>
<div class="hint">ARROW KEYS / WASD: move &nbsp; SPACE: start &nbsp; P: pause &nbsp; M: sound<br>Difficulty can only be changed before a game</div>

<script src="script.js"></script>
</body>
</html>
